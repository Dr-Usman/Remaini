name: Release Android 🤖

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release-android:
    name: Build Signed Android AAB & APKs
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔍 Run Static Analysis & Tests
        run: |
          flutter analyze
          flutter test

      - name: 🔑 Configure Android Signing & Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding Keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/remaini-keystore.jks
            cp android/app/remaini-keystore.jks android/remaini-keystore.jks

            echo "storePassword=${KEYSTORE_PASSWORD}" > android/key.properties
            echo "keyPassword=${KEY_PASSWORD}" >> android/key.properties
            echo "keyAlias=${KEY_ALIAS:-remaini}" >> android/key.properties
            echo "storeFile=remaini-keystore.jks" >> android/key.properties
          else
            echo "⚠️ KEYSTORE_BASE64 not set, falling back to debug signing."
          fi

      - name: 🏗️ Build Google Play App Bundle (AAB)
        run: flutter build appbundle --release

      - name: 🏗️ Build Universal APK
        run: flutter build apk --release

      - name: 🏗️ Build Split-Per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: 🏷️ Organize & Rename Artifacts
        id: vars
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          if [[ "$VERSION_TAG" != v* ]]; then
            VERSION_TAG="${{ github.event.inputs.version || 'v1.0.0' }}"
          fi
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT

          mkdir -p release_outputs

          cp build/app/outputs/bundle/release/app-release.aab release_outputs/Remaini-android-${VERSION_TAG}.aab

          cp build/app/outputs/flutter-apk/app-release.apk release_outputs/Remaini-android-${VERSION_TAG}-universal.apk

          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_outputs/Remaini-android-${VERSION_TAG}-arm64-v8a.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_outputs/Remaini-android-${VERSION_TAG}-armeabi-v7a.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-x86_64-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_outputs/Remaini-android-${VERSION_TAG}-x86_64.apk
          fi

          ls -la release_outputs

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Remaini-android-${{ steps.vars.outputs.tag }}
          path: release_outputs/*
          retention-days: 14

      - name: 🚀 Create GitHub Release & Attach Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Remaini ${{ steps.vars.outputs.tag }} ⏳"
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release_outputs/*
