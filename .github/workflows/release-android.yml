name: Release Android 🤖

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release-android:
    name: Build Signed Android AAB & APKs
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔍 Run Static Analysis & Tests
        run: |
          flutter analyze
          flutter test

      - name: 🔑 Configure Android Signing & Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding Keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/remaini-keystore.jks
            cp android/app/remaini-keystore.jks android/remaini-keystore.jks

            echo "storePassword=${KEYSTORE_PASSWORD}" > android/key.properties
            echo "keyPassword=${KEY_PASSWORD}" >> android/key.properties
            echo "keyAlias=${KEY_ALIAS:-remaini}" >> android/key.properties
            echo "storeFile=remaini-keystore.jks" >> android/key.properties
          else
            echo "⚠️ KEYSTORE_BASE64 not set, falling back to debug signing."
          fi

      # - name: 🏗️ Build Google Play App Bundle (AAB)
      #   run: flutter build appbundle --release

      - name: 🏗️ Build Universal APK
        run: flutter build apk --release

      - name: 🏗️ Build Split-Per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: 🏷️ Organize & Rename Artifacts
        id: vars
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          if [[ "$VERSION_TAG" != v* ]]; then
            VERSION_TAG="${{ github.event.inputs.version || 'v1.0.0' }}"
          fi
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT

          mkdir -p release_outputs

          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            cp build/app/outputs/bundle/release/app-release.aab release_outputs/Remaini-android-${VERSION_TAG}.aab
          fi

          cp build/app/outputs/flutter-apk/app-release.apk release_outputs/Remaini-android-${VERSION_TAG}-universal.apk

          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_outputs/Remaini-android-${VERSION_TAG}-arm64-v8a.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_outputs/Remaini-android-${VERSION_TAG}-armeabi-v7a.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-x86_64-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_outputs/Remaini-android-${VERSION_TAG}-x86_64.apk
          fi

          ls -la release_outputs

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Remaini-android-${{ steps.vars.outputs.tag }}
          path: release_outputs/*
          retention-days: 14

      - name: 📝 Extract Release Notes from CHANGELOG
        env:
          TAG_VERSION: ${{ steps.vars.outputs.tag }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import os, re, sys

          tag_version = os.environ.get('TAG_VERSION', 'v1.0.0')
          repo_name = os.environ.get('REPO_NAME', '')
          version = tag_version.lstrip('v')
          output_file = 'extracted_release_notes.md'

          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()

              pattern = rf'(?m)^##\s+\[?v?{re.escape(version)}\]?(?:\s*-\s*[^\n]*)?\s*\n(.*?)(?=(?:\n##\s+|\Z))'
              match = re.search(pattern, content, re.DOTALL)

              if match:
                  notes = match.group(1).strip()
                  notes = re.sub(r'\n---\s*$', '', notes).strip()
                  with open(output_file, 'w', encoding='utf-8') as out:
                      out.write(notes + '\n')
                  print(f'✅ Successfully extracted release notes for {tag_version}')
              else:
                  print(f'⚠️ No section found in CHANGELOG.md for {tag_version}, using fallback')
                  fallback_text = f'Release **{tag_version}**\n\n'
                  if repo_name:
                      fallback_text += f'See [CHANGELOG.md](https://github.com/{repo_name}/blob/main/CHANGELOG.md) for details.\n'
                  with open(output_file, 'w', encoding='utf-8') as out:
                      out.write(fallback_text)
          except Exception as e:
              print(f'⚠️ Error reading CHANGELOG.md: {e}')
              with open(output_file, 'w', encoding='utf-8') as out:
                  out.write(f'Release **{tag_version}**\n')
          EOF

      - name: 🚀 Create GitHub Release & Attach Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Remaini ${{ steps.vars.outputs.tag }} ⏳"
          body_path: extracted_release_notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release_outputs/*
